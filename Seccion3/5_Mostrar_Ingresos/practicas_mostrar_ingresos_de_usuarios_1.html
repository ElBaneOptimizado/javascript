<!DOCTYPE html>

<html>

<head>
    <title>Ingresos de usuario 1</title>
</head>

<body>
    <input type="text" id="InputTexto" value="Este es un mensaje">
    <button onclick="mostrarTexto()">Click aqui</button>
    <h1 id="titulo"></h1>

<script>

function mostrarTexto() {
    let elementotexto1 = document.getElementById("InputTexto");
        let elementotexto2 = document.getElementById("titulo");
        let mensaje = "Haz dicho " + elementotexto1.value

        elementotexto2.textContent = mensaje;

}
</script>

</body>
</html>
