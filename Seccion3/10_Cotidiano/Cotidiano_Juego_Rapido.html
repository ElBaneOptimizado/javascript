<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Juego Rapido</title>
    <link rel="stylesheet" href="misEstilos.css">
</head>

<body onload="IniciarPagina()">

    <h1>Responde las preguntas rapidamente</h1>

    <div id="contador">30</div>

    <button onclick="Finalizar()">Finalizar</button>
    <button onclick="location.reload()">Reintentar</button>

    <p><strong>1.¿Cual es la Capital de Rusia?</strong></p>
    <input type="text" id="resp1">
    
    <p><strong>2.¿Cuál es el océano más grande del mundo?</strong></p>
    <input type="text" id="resp2">

    <p><strong>3.¿En qué año cayó el Muro de Berlín?</strong></p>
    <input type="text" id="resp3">

    <p><strong>4.¿Cuál es el único mamífero capaz de volar?</strong></p>
    <input type="text" id="resp4">

    <p><strong>5.¿Quién pintó la famosa obra "La noche estrellada"?</strong></p>
    <input type="text" id="resp5">

    <script>
    let tiempo = 30; 
    let intervalo; 

    function IniciarPagina() {
        intervalo = setInterval(contar, 1000); 
    }

    function actualizarContador() {
        document.getElementById("contador").textContent = tiempo;
    }

    function contar() {
        if (tiempo > 0) {
            tiempo--; 
            actualizarContador(); 
        } else {
            detenerContador(); 
            alert("¡GAME OVER! Vuelva a intentarlo."); 
        }
    }

    function detenerContador() {
        clearInterval(intervalo);
    }

    function Finalizar() {
        detenerContador(); 
        let fecha = new Date().toLocaleDateString('es-ES');
        
        alert("Fecha: " + fecha + " | Respuestas: " + 
              document.getElementById("resp1").value + ", " + 
              document.getElementById("resp2").value + ", " + 
              document.getElementById("resp3").value + ", " + 
              document.getElementById("resp4").value + ", " + 
              document.getElementById("resp5").value);
    }
    </script>
</body>
</html>
