<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Practica Loop For 1</title>
</head>

<body>
    <script>
        function testLoop() {
            for (let x = 1; x <= 3; x++) {
                document.write("Mensaje " + x + "<br>");
            }
        }
        testLoop()
    </script>
</body>

</html>
