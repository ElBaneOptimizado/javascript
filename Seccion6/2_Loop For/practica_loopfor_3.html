<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Practica Loop For 3</title>
</head>

<body>

    <script>
        function testLoop() {
            let suma = 0;
            for (let x = 1; x <= 4; x++) {
                suma = suma + x;
            }
            console.log(suma);
        }
        testLoop();
    </script>

</body>

</html>
