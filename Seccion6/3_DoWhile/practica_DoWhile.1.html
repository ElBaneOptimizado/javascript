<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
  function testLoop(totalVueltas) {
    let contador = 1;
    do {
        console.log("Vuelta numero: " + contador);
        contador++;
    } while (contador <= totalVueltas);
}

let vueltasUsuario = prompt("¿Cuantas vueltas quieres?");
testLoop(vueltasUsuario);

</script>
</body>
