<!DOCTYPE html>
<html>
<head>
    <title>Parametros 1</title>
</head>
<body>

    <p>Primer Número</p>
    <input type="number" id="primerNumero">
    <p>Segundo Número</p>
    <input type="number" id="segundoNumero">
    
    <p>
        
        <button onclick="ejecutarSuma()">Click aqui</button>
    </p>

<script>
    
    function suma(numero1, numero2) {
        let resultado = numero1 + numero2;
        return resultado; 
    }

    
    function ejecutarSuma() {
        let n1 = parseInt(document.getElementById("primerNumero").value);
        let n2 = parseInt(document.getElementById("segundoNumero").value);
        
        let resultadoFinal = suma(n1, n2);
        
        
        alert("El resultado es: " + resultadoFinal);
    }
</script>
</body>
</html>
