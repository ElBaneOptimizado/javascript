<!DOCTYPE html>
<html>
<head>
    <title>Math 1</title>
</head>
<body>

    <p>
        <button onclick="mostrarMensaje()">Click aqui</button>
    </p>

    <script>
        function potenciar(base, exponente){
            return Math.pow(base, exponente);
        }

        let resultadoPotencia = potenciar(2, 4); 

        function mostrarMensaje() {
            alert(resultadoPotencia);
            return resultadoPotencia;
        }

        
    </script>

</body>
</html>
