<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotidiano Cine</title>
    <link rel="stylesheet" href="misEstilos.css">
    <script src="misScripts.js"></script>
</head>
<body>

    <div>
        <h1>Recomendador de Películas</h1>
        
       
        <input type="number" id="edad" placeholder="Escribe tu edad">

        
        <select id="genero">
            <option value="Drama">Drama</option>
            <option value="Comedia">Comedia</option>
            <option value="Musical">Musical</option>
            <option value="Crimen">Crimen</option>
        </select>

        
        <button onclick="recomendarPelicula()">Recomendar</button>

        <h2>Película Recomendada:</h2>
        <p id="resultado"></p>
    </div>

</body>
</html>
